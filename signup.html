<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - EDUVA Learn Track</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-box">
        <h1>สมัครสมาชิก</h1>
        <form id="signupForm">
            <input type="email" id="email" placeholder="อีเมล" required style="width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box;">
            <input type="password" id="password" placeholder="รหัสผ่าน (6 ตัวขึ้นไป)" required style="width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box;">
            <button type="submit" style="width: 100%; padding: 10px; background-color: #315efb; color: white; border: none; border-radius: 5px; cursor: pointer;">สมัครสมาชิก</button>
        </form>
        <p id="message" style="margin-top: 15px;"></p>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
