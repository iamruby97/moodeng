<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EDUVA Learn Track</title>

    <style>
        body {
            font-family: Arial, sans-serif;

            background-image: url("background.gif");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 35px;
            border-radius: 20px;
            text-align: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #315efb;
            margin-bottom: 5px;
        }

        p {
            color: #666;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;

            border: 1px solid #ddd;
            border-radius: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;

            border: none;
            border-radius: 10px;

            background: #315efb;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #244bd0;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>EDUVA</h1>

        <p>Learn Track</p>

        <input
            type="text"
            id="username"
            placeholder="ชื่อผู้ใช้งาน">

        <input
            type="password"
            id="password"
            placeholder="รหัสผ่าน">

        <button onclick="login()">
            เข้าสู่ระบบ
        </button>

    </div>

    <script>
        function login() {

            let username =
                document.getElementById("username").value;

            let password =
                document.getElementById("password").value;

            if (username === "" || password === "") {

                alert("กรุณากรอกชื่อผู้ใช้และรหัสผ่าน");

                return;
            }

            alert("เข้าสู่ระบบสำเร็จ!");
        }
    </script>

</body>

</html>
