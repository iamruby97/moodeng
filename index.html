<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUVA Learn Track</title>
    <!-- นำเข้าฟอนต์ Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- อย่าลืมเปลี่ยนเลข ?v= ทุกครั้งที่แก้ไขโค้ดเพื่อล้างแคช -->
    <link rel="stylesheet" href="style.css?v=2001">
</head>
<body>

    <!-- =========================================
         พื้นที่ใส่ UI หลักของเว็บคุณ (วางไว้ตรงนี้ได้เลย)
         ========================================= -->
    <main class="main-content">
        <header class="app-header">
            <h1>📚 EDUVA Learn Track</h1>
        </header>

        <section class="user-card">
            <div class="profile-section">
                <!-- ใส่รูปโปรไฟล์ของคุณ -->
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile" class="user-avatar">
                <div class="user-info">
                    <h2>puupy</h2>
                    <p>student@email.com</p>
                </div>
            </div>

            <!-- กล่องเป้าหมายประจำสัปดาห์ -->
            <div class="goal-box">
                <div class="goal-header">
                    <span>📊 เป้าหมายสัปดาห์นี้</span>
                    <span class="goal-percent">75%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 75%;"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- ดึงไฟล์ JS มาทำงาน -->
    <script type="module" src="app.js?v=2001"></script>
</body>
</html>
