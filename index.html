<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUVA Learn Track</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-box { display: none; }
        .form-box.active { display: block; }
        .toggle-link { color: #315efb; cursor: pointer; font-weight: bold; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-box" style="max-width: 400px; margin: 40px auto; padding: 25px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); text-align: center;">
        
        <!-- 1. ฟอร์มเข้าสู่ระบบ -->
        <div id="loginSection" class="form-box active">
            <h2 style="margin-bottom: 20px;">เข้าสู่ระบบ</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="อีเมล" required style="width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;">
                <input type="password" id="loginPassword" placeholder="รหัสผ่าน" required style="width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;">
                <button type="submit" style="width: 100%; padding: 12px; background-color: #315efb; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px;">เข้าสู่ระบบ</button>
            </form>
            <p id="loginMessage" style="margin-top: 15px;"></p>
            <p style="margin-top: 20px; color: #666;">
                ยังไม่มีบัญชี? <span class="toggle-link" onclick="switchTab('signup')">สมัครสมาชิก</span>
            </p>
        </div>

        <!-- 2. ฟอร์มสมัครสมาชิก -->
        <div id="signupSection" class="form-box">
            <h2 style="margin-bottom: 20px;">สมัครสมาชิก</h2>
            <form id="signupForm">
                <input type="email" id="email" placeholder="อีเมล" required style="width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;">
                <input type="password" id="password" placeholder="รหัสผ่าน (6 ตัวขึ้นไป)" required style="width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;">
                <button type="submit" style="width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px;">สมัครสมาชิก</button>
            </form>
            <p id="message" style="margin-top: 15px;"></p>
            <p style="margin-top: 20px; color: #666;">
                มีบัญชีอยู่แล้ว? <span class="toggle-link" onclick="switchTab('login')">เข้าสู่ระบบ</span>
            </p>
        </div>

    </div>

    <script>
        function switchTab(tab) {
            const loginSection = document.getElementById('loginSection');
            const signupSection = document.getElementById('signupSection');

            if (tab === 'login') {
                loginSection.classList.add('active');
                signupSection.classList.remove('active');
            } else {
                signupSection.classList.add('active');
                loginSection.classList.remove('active');
            }
        }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
