<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUVA Learn Track</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #f0f4f8;
            color: #333;
        }

        /* Navbar แบบเรียบง่าย */
        .navbar {
            width: 100%;
            height: 60px;
            padding: 0 24px;
            background: #ffffff;
            border-bottom: 1px solid #e1e8ed;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 600;
            font-size: 18px;
            color: #0066ff;
        }

        /* ปุ่มโปรไฟล์ */
        .profile-wrapper {
            position: relative;
        }

        .avatar-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .avatar-btn img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0066ff;
        }

        /* Dropdown โปรไฟล์ */
        .profile-dropdown {
            position: absolute;
            top: 50px;
            right: 0;
            width: 240px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid #e1e8ed;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
        }

        .hidden {
            display: none !important;
        }

        .dropdown-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dropdown-header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-info h4 {
            font-size: 14px;
            color: #111;
        }

        .user-info p {
            font-size: 11px;
            color: #666;
        }

        .reset-btn {
            width: 100%;
            padding: 8px;
            background: #ff4d4f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }

        .reset-btn:hover {
            background: #d9363e;
        }

        /* Layout แดชบอร์ด */
        .dashboard-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e1e8ed;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .card h3 {
            font-size: 15px;
            margin-bottom: 12px;
            color: #0066ff;
        }

        .card ul {
            list-style-position: inside;
            font-size: 13px;
            color: #555;
            line-height: 1.8;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e1e8ed;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #0066ff;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">📚 EDUVA Learn Track</div>

        <div class="profile-wrapper">
            <button id="avatar-btn" class="avatar-btn">
                <img id="nav-img" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile">
            </button>

            <div id="profile-dropdown" class="profile-dropdown hidden">
                <div class="dropdown-header">
                    <img id="menu-img" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile">
                    <div class="user-info">
                        <h4 id="user-name">User</h4>
                        <p id="user-email">user@example.com</p>
                    </div>
                </div>

                <hr style="border: none; border-top: 1px solid #eee;">

                <button id="reset-system-btn" class="reset-btn">🔄 รีเซ็ตระบบทั้งหมด</button>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <section class="grid-cards">
            <div class="card">
                <h3>📖 วิชาที่กำลังเรียน</h3>
                <ul>
                    <li>Web Development</li>
                    <li>Database Basics</li>
                    <li>UI Design</li>
                </ul>
            </div>

            <div class="card">
                <h3>✅ งานที่ต้องทำ (To-Do)</h3>
                <ul>
                    <li>ทำความเข้าใจ HTML/CSS</li>
                    <li>ออกแบบหน้าเว็บใหม่</li>
                </ul>
            </div>

            <div class="card">
                <h3>📊 เป้าหมายสัปดาห์นี้</h3>
                <p style="font-size: 13px; color: #555;">ความก้าวหน้า: <strong>50%</strong></p>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 50%;"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // ปุ่มและเมนู
        const avatarBtn = document.getElementById('avatar-btn');
        const dropdown = document.getElementById('profile-dropdown');
        const resetBtn = document.getElementById('reset-system-btn');

        // เปิด/ปิด Dropdown
        avatarBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!dropdown.contains(e.target) && !avatarBtn.contains(e.target)) {
                dropdown.classList.add('hidden');
            }
        });

        // ปุ่มล้างค่าในระบบทั้งหมด (Clear localStorage)
        resetBtn.addEventListener('click', () => {
            if (confirm('คุณต้องการรีเซ็ตตั้งค่ารูปภาพและชื่อทั้งหมดกลับเป็นค่าเริ่มต้นใช่หรือไม่?')) {
                localStorage.clear();
                window.location.reload();
            }
        });
    </script>
</body>
</html>
