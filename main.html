<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลัก - EDUVA Learn Track</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="max-width: 500px; margin: 60px auto; padding: 30px; background: rgba(255, 255, 255, 0.95); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center;">
        
        <h1 style="color: #333; margin-bottom: 10px;">ยินดีต้อนรับ! 🎉</h1>
        <p style="font-size: 16px; color: #555;">เข้าสู่ระบบในชื่อ: <strong id="userEmail" style="color: #315efb;">กำลังโหลด...</strong></p>

        <div style="margin: 25px 0; padding: 20px; background: #f0f4ff; border-radius: 8px;">
            <h3 style="margin-top: 0;">📚 EDUVA Learn Dashboard</h3>
            <p style="color: #666; margin-bottom: 0;">ยินดีต้อนรับสู่พื้นที่เรียนรู้ของคุณ เริ่มต้นบันทึกความก้าวหน้าได้เลย!</p>
        </div>

        <button id="logoutBtn" style="padding: 10px 20px; background-color: #dc3545; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s;">
            ออกจากระบบ (Sign Out)
        </button>
        
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
